name: CD — Docker Release, Smoke Test & Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-release:
    name: Build, Smoke Test & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Docker image for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          load: true
          tags: pocketbase-custom:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container (/ready & /admin/ SPA)
        run: |
          docker run -d --name pb-smoke -p 8090:8090 \
            -e PB_ADMIN_EMAIL=admin@example.com \
            -e PB_ADMIN_PASSWORD=admin123456 \
            pocketbase-custom:smoke

          echo "Waiting for PocketBase container readiness..."
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8090/ready >/dev/null 2>&1; then
              echo "✅ /ready responded 200 OK"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "❌ Container failed readiness check"
              docker logs pb-smoke
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8090/ready | grep -q '"status":"ready"'
          curl -fsS http://127.0.0.1:8090/admin/ | grep -qi "<!doctype html>"
          echo "✅ Smoke test passed!"
          docker rm -f pb-smoke

      - name: Push verified image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    name: Deploy to Production Server (SSH)
    needs: docker-release
    # Bật tự động khi cấu hình Repository Variable: DEPLOY_ENABLED = true
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH with pre-deploy SQLite backup
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/pocketbase-custom' }}

            # 1. Sao lưu an toàn SQLite pb_data trước khi cập nhật container
            if [ -d "pb_data" ]; then
              mkdir -p backups
              tar -czf "backups/pb_data_$(date +%Y%m%d_%H%M%S).tar.gz" pb_data/data.db pb_data/auxiliary.db 2>/dev/null || true
              ls -1t backups/pb_data_*.tar.gz | tail -n +11 | xargs -r rm -f
            fi

            # 2. Pull image mới & khởi động lại container
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f .docker/docker-compose.yml pull
            docker compose -f .docker/docker-compose.yml up -d --remove-orphans

            # 3. Kiểm tra /ready sau khi nâng cấp
            for i in $(seq 1 15); do
              if wget -qO- http://127.0.0.1:${PORT:-8090}/ready >/dev/null 2>&1; then
                echo "✅ Deployment healthy!"
                exit 0
              fi
              sleep 1
            done
            echo "❌ Deployment healthcheck failed!"
            docker compose -f .docker/docker-compose.yml logs --tail=50
            exit 1

