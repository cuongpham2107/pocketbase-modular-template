name: CI — Lint, Test & Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go Backend (Vet, Test & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod / go.sum tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run unit & integration tests (migrations + modules)
        run: go test -v -race ./...

      - name: Compile standalone binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o tmp/pocketbase .

  frontend:
    name: React Admin Portal (Lint, Vitest & Typecheck/Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

      - name: Run Vitest unit tests
        run: npm run test

      - name: Typecheck (tsc) & build production SPA bundle
        run: npm run build

      - name: Verify built SPA assets in pb_public/admin
        working-directory: .
        run: test -f pb_public/admin/index.html

